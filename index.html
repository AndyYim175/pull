<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pull the Sword - A 3D interactive game" />
    <meta name="theme-color" content="#0a0f0a" />
    <title>Pull the Sword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Fira Code', monospace;
        background-color: #0a0f0a;
      }
      /* Initial loading state */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0f0a;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-content {
        text-align: center;
      }
      #loading-emoji {
        font-size: 3rem;
        animation: pulse 2s ease-in-out infinite;
      }
      #loading-text {
        color: rgba(255, 215, 0, 0.6);
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        margin-top: 1rem;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="loading-content">
        <div id="loading-emoji">⚔️</div>
        <div id="loading-text">loading...</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Show error if app doesn't load within 10 seconds
      setTimeout(() => {
        const loading = document.getElementById('loading');
        const root = document.getElementById('root');
        if (loading && root && root.children.length === 0) {
          // App didn't load, show error
          loading.innerHTML = `
            <div style="text-align:center;padding:2rem;">
              <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
              <div style="color:#ffd700;font-size:1.2rem;margin-bottom:1rem;">Failed to load</div>
              <div style="color:rgba(255,255,255,0.5);font-size:0.875rem;margin-bottom:1.5rem;">The app couldn't start. Please try refreshing.</div>
              <button onclick="window.location.reload()" style="padding:0.75rem 2rem;background:rgba(255,215,0,0.2);border:1px solid rgba(255,215,0,0.5);border-radius:0.5rem;color:#ffd700;cursor:pointer;font-family:inherit;font-size:0.875rem;">Reload Page</button>
            </div>
          `;
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
